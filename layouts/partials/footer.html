<footer id="footer">
  <div class="footer-left">
    <p>
      Copyright &copy; {{ now.Year }} {{ .Site.Title }}
      <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="license" target="_blank">
        CC BY-SA 4.0
      </a>
    </p>
  </div>
  <div class="footer-right">
    {{ range .Site.Menus.footer }}
      <a href="{{ .URL }}">{{ .Name }}</a>
    {{ end }}
  </div>
</footer>
