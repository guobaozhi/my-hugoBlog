<nav class="lang-switch">
  <ul>
    {{ range $.Site.Home.AllTranslations }}
      <li>
        <a href="{{ .RelPermalink }}"
           title="{{ .Language.LanguageName }}"
           {{ if eq .Lang $.Lang }} class="active" {{ end }}>
          {{ .Language.LanguageName }}
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
