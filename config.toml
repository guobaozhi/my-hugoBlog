baseURL = "https://gridframe.cn"
languageCode = "zh-Hans"               # 全局语言代码，这里设为简体中文
defaultContentLanguage = "zh"          # 默认内容语言为中文
defaultContentLanguageInSubdir = false # 中文在根路径 /，英文在 /en/（推荐）
hasCJKLanguage = true                  # 对中文友好：字数统计、摘要等

title = "Boz's Blog"
theme = "cactus"
copyright = "Boz"           # cactus 会用 title 作为版权文本（你可以改成自己的名字）
disqusShortname = "example" # 评论用 Disqus 时使用

# googleAnalytics = "UA-1234-5"               # 若要用 GA4，请用 services.googleAnalytics，此处已注释

# summaryLength = 2                            # 可根据需要开启

# ============ 多语言配置 ============

[languages]
# 中文（简体）
[languages.zh]
languageName = "中文"
languageCode = "zh-Hans"
title = "Boz's Blog"
weight = 1
contentDir = "content/zh" # 中文内容放在 content/zh 下

# 英文
[languages.en]
languageName = "English"
languageCode = "en-US"
title = "Boz's Blog"
weight = 2
contentDir = "content/en" # 英文内容放在 content/en 下

# ============ 中文菜单 ============

[[languages.zh.menu.main]]
name = "首页"
url = "/"
weight = 1

[[languages.zh.menu.main]]
name = "文章"
pageRef = "posts"
# url = "/posts/"
weight = 2

# [[languages.zh.menu.main]]
# name = "标签"
# url = "/tags/"
# weight = 3

[[languages.zh.menu.main]]
name = "关于"
url = "/about/"
weight = 3

# ============ 英文菜单 ============

[[languages.en.menu.main]]
name = "Home"
pageRef = "/"
# url = "/"
weight = 1

[[languages.en.menu.main]]
name = "Posts"
pageRef = "posts"
# url = "/posts/"
weight = 2

# [[languages.en.menu.main]]
# name = "Tags"
# url = "/tags/"
# weight = 3

[[languages.en.menu.main]]
name = "About"
pageRef = "about"
# url = "/about/"
weight = 3

# ============ 中文主题参数 ============

[languages.zh.params]
colortheme = "white"        # dark, light, white, 或 classic
rss = true                  # 生成 RSS
showAllPostsArchive = false # 默认值

description = "没什么大道理，就是不想让这些笔记烂在硬盘里。"
mainSection = "posts"
showAllPostsOnHomePage = true
postsOnHomePage = 5                         # 若 showAllPostsOnHomePage 为 true 则忽略此项
tagsOverview = true
showProjectsList = false
projectsUrl = "https://github.com/gohugoio"
dateFormat = "2006-01-02"
show_updated = true
showReadTime = true

# 中文评论配置（可按需启用）
[languages.zh.params.comments]
enabled = true
engine = "cactus_comments" # 支持 disqus / utterances / cactus_comments
# [languages.zh.params.comments.utterances]
#   repo = "<你的GitHub用户名>/<你的仓库名>"
#   label = "hugo-site-name"
#   theme = "github-light"
[languages.zh.params.comments.cactuscomments]
siteName = "your_cactus_comments_sitename"
# serverUrl = ""                        # 默认 https://matrix.cactus.chat:8448
# serverName = ""                       # 默认 cactus.chat

# ============ 英文主题参数 ============

[languages.en.params]
colortheme = "white"
rss = true
showAllPostsArchive = false

description = "This is Boz's personal blog where he shares his thoughts and knowledge."
mainSection = "posts"
showAllPostsOnHomePage = false
postsOnHomePage = 5
tagsOverview = true
showProjectsList = false
projectsUrl = "https://github.com/gohugoio"
dateFormat = "2006-01-02"
show_updated = true
showReadTime = true

[languages.en.params.comments]
enabled = true
engine = "cactus_comments"
# [languages.en.params.comments.utterances]
#   repo = "<your_github_username>/<your_github_reponame>"
#   label = "hugo-site-name"
#   theme = "github-light"
[languages.en.params.comments.cactuscomments]
siteName = "your_cactus_comments_sitename"
# serverUrl = ""
# serverName = ""

# ============ 社交链接（中英文共用，你也可以按语言分开） ============

[[params.social]]
name = "github"
link = "https://github.com/gohugoio"
[[params.social]]
name = "linkedin"
link = "https://www.linkedin.com/company/github/"
[[params.social]]
name = "email"
link = "guobaozhi@gmail.com" # 无需加 mailto: 前缀

# ============ 标记高亮等全局配置（多语言通常共享） ============

[markup]
[markup.tableOfContents]
endLevel = 4
ordered = false
startLevel = 2
[markup.highlight]
codeFences = true
guessSyntax = false
hl_Lines = ""
lineNoStart = 1
lineNos = true
lineNumbersInTable = false
noClasses = true
style = "dracula"
tabWidth = 4
[params]
css = ["css/custom.css"]
