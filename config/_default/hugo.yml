# 基础功能配置
baseURL: "https://gridframe.cn"
title: Boz's Blog
languageCode: "zh-cn"
theme: PaperMod # 主题名称

# 多语言配置
defaultContentLanguage: zh
defaultContentLanguageInSubdir: true

languages:
  zh:
    languageName: 中文
    weight: 1
    contentDir: content/zh
    title: Boz's技术博客
    languageCode: zh-cn
  en:
    languageName: English
    weight: 2
    contentDir: content/en
    title: Bosz's Blog
    languageCode: en-us


# 分页配置
paginate: 10  # 每页文章数
paginatePath: "page"  # 分页目录

# 构建配置
enableRobotsTXT: true
buildDrafts: false # 不构建草稿
buildFuture: false # 不构建未来的文章
buildExpired: false # 不构建过期的文章

# URL 配置
uglyURLs: false # 使用美观的 URL
relativeURLs: false # 使用绝对 URL
canonifyURLs: false # 不强制规范化 URL

googleAnalytics: UA-123-45

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: ExampleSite
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  author: Boz
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false
  # busuanzi:
  #   enable: false # 开启网站访问量统计

# 功能开关
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  searchHidden: false
  showtoc: true
  tocopen: true

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: Welcome to boz's blog

  socialIcons:
    - name: x
      url: "https://x.com/"
    - name: stackoverflow
      url: "https://stackoverflow.com"
    - name: github
      url: "https://github.com/"

  analytics:
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page
    responsiveImages: false # To reduce generation time and size of the site
    linkFullImages: #true To enable hyperlinks to the full image size on post pages

  editPost:
    URL: "https://github.com/guobaozhi/my-hugoBlog/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

# Customizing Fusejs Options
# Read: https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
# for search
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

  goldmark:
    renderer:
      unsafe: true
